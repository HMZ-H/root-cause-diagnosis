[project]
name = "root-cause-diagnosis"
description = "Backend and infrastructure incidents where the obvious answer is the symptom, not the cause. Scored so that naming the symptom is penalised."
tags = ["debugging", "backend", "devops", "sre", "root-cause", "eval", "train"]
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["root_cause_diagnosis.py", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
